name: smartpayla
description: "SmartPayLA - a field ledger for sales agents to track debts, payments and commissions."
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.0
  intl: ^0.20.0
  uuid: ^4.4.0
  http: ^1.2.0
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^1.0.2
  # Copies bill photos into the app's documents folder so they survive cache
  # clearing (native only; the web build inlines them as base64 instead).
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
